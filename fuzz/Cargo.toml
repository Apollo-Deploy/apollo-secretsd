[package]
name = "apollo-secretsd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
secretsd-protocol = { version = "=0.1.0", path = "../crates/secretsd-protocol" }
prost = "0.14.4"

[workspace]
members = ["."]

[[bin]]
name = "frame_and_messages"
path = "fuzz_targets/frame_and_messages.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
